(function(){
 const c=E("ascii"),g=c.getContext("2d"),CH=" .·:-=+*#%@01";let W,H,cols,rows,run=false,t=0,last=0;const cell=15;
 function size(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);cols=Math.ceil(W/cell);rows=Math.ceil(H/cell);g.font="12px Inter Tight, sans-serif";g.textBaseline="top"}
 function draw(ts){
  if(!run)return;requestAnimationFrame(draw);if(ts-last<55)return;last=ts;t+=.035;
  g.clearRect(0,0,W,H);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
   let v=Math.sin(x*.22+t*1.3)+Math.sin(y*.3-t)+Math.sin((x+y)*.12+t*.7);v=(v+3)/6;
   v*=.85;
   const i=Math.floor(v*(CH.length-1));if(!i)continue;
   g.fillStyle=`rgba(47,209,126,${.18+v*.7})`;g.fillText(CH[i],x*cell,y*cell)}
 }
 function stat(){t=1;run=true;draw(1e9);run=false}
 addEventListener("resize",()=>{size();if(still)stat()});
 size();if(still){stat();return}
 new IntersectionObserver(([e])=>{if(e.isIntersecting&&!run){run=true;requestAnimationFrame(draw)}else if(!e.isIntersecting)run=false}).observe(c);
})();
